<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANALTENA × opXEN Burner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pink:#ff5db3; --pink-hot:#ff1493; --pink-soft:#ffc1dc; --pink-muted:#c57aa8;
    --gold:#ffd84d; --gold-deep:#ff9500;
    --black:#000; --ink:#220010;
    --green:#4ade80; --red:#ff4466;
    --bg-card:rgba(35,0,22,.40); --bg-inset:rgba(0,0,0,.35); --bg-inset-hi:rgba(0,0,0,.40);
    --border:rgba(255,105,180,.20); --border-hi:rgba(255,93,179,.55);
    --fg1:#ffc1dc; --fg2:#c57aa8;
    --font-display:'Space Grotesk',system-ui,sans-serif;
    --font-body:'Space Grotesk',system-ui,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,monospace;
  }
  @keyframes starMove { from { transform: translateY(0); } to { transform: translateY(220px); } }
  html, body { margin:0; min-height:100vh; background:#000; color:var(--fg1); font-family:var(--font-body); -webkit-font-smoothing:antialiased; }
  body {
    display:flex; align-items:center; justify-content:center;
    padding:1.5rem 1.5rem 3rem;
    overflow-x:hidden; position:relative;
    background:
      radial-gradient(circle at 50% 16%, rgba(255,0,140,.18), transparent 32%),
      radial-gradient(circle at 50% 70%, rgba(133,0,255,.08), transparent 35%),
      #000;
  }
  .container { position:relative; z-index:1; width:100%; max-width:480px; }

  h1.hero {
    font-size:1.6rem; font-weight:700; text-align:center; margin:0 0 .25rem;
    background:linear-gradient(90deg,#ff5db3,#ffd84d);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    letter-spacing:-.02em; font-family:var(--font-display);
  }
  .subtitle { text-align:center; color:var(--pink-muted); font-size:.85rem; margin-bottom:1.25rem; }

  .steps { display:flex; align-items:center; justify-content:center; gap:0; margin-bottom:1.25rem; }
  .step-dot {
    width:28px; height:28px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:.7rem; font-weight:700;
    border:1.5px solid var(--border);
    background:var(--bg-card); color:var(--pink-muted);
    font-family:var(--font-mono);
  }
  .step-dot.active { border-color:var(--pink); color:var(--pink); background:rgba(255,20,147,.1); }
  .step-dot.done   { border-color:var(--green); color:#063; background:var(--green); }
  .step-line { flex:0 0 32px; height:1px; background:var(--border); margin:0 4px; }
  .step-line.done { background:var(--green); }

  .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; margin-top:1rem; }

  .tabs { display:flex; gap:6px; margin-bottom:1rem; }
  .tab {
    flex:1; padding:6px 10px; border-radius:8px;
    background:var(--bg-inset); border:1px solid var(--border);
    color:var(--pink-muted); font-family:var(--font-mono); font-size:.7rem;
    text-transform:uppercase; letter-spacing:.1em; cursor:pointer; text-align:center;
  }
  .tab.on { background:rgba(255,20,147,.15); border-color:var(--pink); color:var(--pink); }

  .alloc-stage { position:relative; text-align:center; padding:1rem 0 .5rem; }
  .alloc-stage .stamp-pos { position:absolute; top:-6px; right:4px; }
  .alloc-stage .egg-1 { position:absolute; top:10px; left:8px; font-size:22px; transform:rotate(-18deg); }
  .alloc-stage .egg-2 { position:absolute; bottom:28px; right:-4px; font-size:20px; transform:rotate(24deg); }
  .alloc-stage .big {
    font-family:var(--font-display); font-weight:700; font-size:2.4rem;
    color:var(--gold); letter-spacing:-.02em; line-height:1;
    text-shadow:3px 3px 0 #ff1493, 6px 6px 0 #a855f7;
    margin:.4rem 0 .2rem;
  }
  .alloc-stage .big .unit { font-size:1rem; color:var(--pink-muted); font-family:var(--font-body); font-weight:500; text-shadow:none; margin-left:.2em; }

  a { color:inherit; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
{% raw %}
const { useState, useEffect } = React;

// ---------- Primitives ----------
function Card({ children, style = {} }) {
  return (
    <div style={{
      background:'rgba(35,0,22,.40)', border:'1px solid rgba(255,105,180,.2)',
      borderRadius:'1.25rem', padding:'1.75rem 1.5rem',
      backdropFilter:'blur(10px)', boxShadow:'0 0 40px rgba(255,20,147,.08)', ...style,
    }}>{children}</div>
  );
}

function Button({ variant='pink', children, disabled, done, onClick, style={} }) {
  const base = {
    width:'100%', padding:'.85rem 1rem', border:'none', borderRadius:'.7rem',
    fontFamily:"'Space Grotesk',system-ui,sans-serif", fontWeight:700, fontSize:'.95rem',
    cursor: disabled ? 'not-allowed' : 'pointer', transition:'all .2s',
    marginBottom:'.5rem', display:'flex', alignItems:'center', justifyContent:'center', gap:6,
  };
  const variants = {
    pink:{ background:'linear-gradient(135deg,#ff5db3,#ff1493)', color:'#fff', boxShadow:'0 4px 20px rgba(255,20,147,.35)' },
    gold:{ background:'linear-gradient(135deg,#ffd84d,#ff9500)', color:'#220010', boxShadow:'0 4px 20px rgba(255,216,77,.3)' },
  };
  const doneStyle = { background:'#4ade80', color:'#063', boxShadow:'none' };
  const [hover, setHover] = useState(false);
  const lift = hover && !disabled && !done ? { transform:'translateY(-1px)', boxShadow:'0 6px 25px rgba(255,20,147,.5)' } : {};
  return (
    <button onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)}
      onClick={onClick} disabled={disabled}
      style={{ ...base, ...variants[variant], ...(done?doneStyle:{}), ...(disabled?{opacity:.4}:{}), ...lift, ...style }}
    >{children}</button>
  );
}

function Input({ value, onChange, placeholder, type='text' }) {
  const [focus, setFocus] = useState(false);
  return (
    <input type={type} value={value} onChange={e=>onChange?.(e.target.value)} placeholder={placeholder}
      onFocus={()=>setFocus(true)} onBlur={()=>setFocus(false)}
      style={{
        width:'100%', padding:'.8rem 1rem',
        background:'rgba(0,0,0,.4)',
        border:`1px solid ${focus ? '#ff5db3' : 'rgba(255,105,180,.2)'}`,
        borderRadius:'.7rem', color:'#ffc1dc',
        fontFamily:'inherit', fontSize:'1rem', marginBottom:'.6rem', outline:'none',
        boxSizing:'border-box',
      }}/>
  );
}

function SectionLabel({ children }) {
  return <p style={{
    textTransform:'uppercase', fontSize:'.7rem', letterSpacing:'.15em',
    color:'#ff5db3', fontWeight:600, marginBottom:'.5rem', marginTop:0,
  }}>{children}</p>;
}

function Divider() {
  return <div style={{ height:1, background:'rgba(255,105,180,.2)', margin:'1.2rem 0' }}/>;
}

function AddressRow({ tag, address }) {
  const empty = !address;
  return (
    <div style={{
      display:'flex', alignItems:'center', justifyContent:'space-between',
      padding:'.7rem .9rem', background:'rgba(0,0,0,.35)',
      border:'1px solid rgba(255,105,180,.2)', borderRadius:'.7rem',
      marginBottom:'.6rem', fontFamily:"'JetBrains Mono',monospace", fontSize:'.82rem',
    }}>
      <span style={{ fontFamily:"'Space Grotesk',system-ui,sans-serif", color:'#ffc1dc', fontWeight:600, fontSize:'.78rem', letterSpacing:'.05em' }}>{tag}</span>
      <span style={{ color: empty ? '#c57aa8' : '#ffd84d' }}>{empty ? 'not connected' : address}</span>
    </div>
  );
}

function StatTile({ label, value, unit }) {
  return (
    <div style={{
      background:'rgba(0,0,0,.35)', border:'1px solid rgba(255,105,180,.2)',
      borderRadius:'.7rem', padding:'.7rem .9rem', textAlign:'center',
    }}>
      <div style={{ fontSize:'.65rem', color:'#c57aa8', textTransform:'uppercase', letterSpacing:'.1em' }}>{label}</div>
      <div style={{ fontSize:'1.1rem', color:'#ffd84d', fontWeight:700, fontFamily:"'JetBrains Mono',monospace", marginTop:'.2rem' }}>
        {value}{unit && <span style={{ fontSize:'.7rem', color:'#c57aa8', marginLeft:3, fontFamily:"'Space Grotesk',system-ui,sans-serif", fontWeight:400 }}> {unit}</span>}
      </div>
    </div>
  );
}

function BurnEntry({ amount, txHash }) {
  return (
    <div style={{
      display:'flex', justifyContent:'space-between', alignItems:'center',
      padding:'.5rem .7rem', background:'rgba(0,0,0,.3)',
      borderRadius:'.5rem', marginBottom:'.35rem', fontSize:'.78rem',
    }}>
      <span style={{ color:'#ffd84d', fontFamily:"'JetBrains Mono',monospace" }}>{amount.toLocaleString('en')} opXEN</span>
      <a href={txHash ? `https://optimistic.etherscan.io/tx/${txHash}` : '#'}
         target="_blank" rel="noopener"
         style={{ color:'#ff5db3', textDecoration:'none', fontFamily:"'JetBrains Mono',monospace" }}>tx ↗</a>
    </div>
  );
}

function StatusText({ children, kind }) {
  const colors = { ok:'#4ade80', err:'#ff4466' };
  return <p style={{
    marginTop:'.6rem', fontSize:'.82rem',
    color: colors[kind] || '#c57aa8', wordBreak:'break-all', minHeight:'1.2em',
  }}>{children}</p>;
}

function Footer() {
  return (
    <div style={{ marginTop:'1.25rem', textAlign:'center', fontSize:'.75rem', color:'#c57aa8' }}>
      <a href="https://analtena.com/" target="_blank" rel="noopener" style={{ color:'#ff5db3', textDecoration:'none', fontWeight:600 }}>analtena.com</a>
      {' · '}
      <a href="https://optimistic.etherscan.io/address/0xdDd1A839b790Aa4A12C665417Ff37F2Ab39F4FE2" target="_blank" rel="noopener" style={{ color:'#ff5db3', textDecoration:'none' }}>Burner contract</a>
      {' · '}
      <a href="/burners" style={{ color:'#ff5db3', textDecoration:'none' }}>Other burners</a>
    </div>
  );
}

function StarField() {
  const style = {
    position:'fixed', inset:0, zIndex:0, pointerEvents:'none',
    background:[
      'radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,.95), transparent 60%)',
      'radial-gradient(2px 2px at 120px 90px, rgba(255,255,255,.85), transparent 60%)',
      'radial-gradient(1.5px 1.5px at 200px 40px, rgba(255,255,255,.9), transparent 60%)',
      'radial-gradient(2px 2px at 300px 130px, rgba(255,255,255,.8), transparent 60%)',
      'radial-gradient(1.5px 1.5px at 420px 60px, rgba(255,255,255,.9), transparent 60%)',
      'radial-gradient(2px 2px at 520px 150px, rgba(255,255,255,.8), transparent 60%)',
      'radial-gradient(1.5px 1.5px at 680px 70px, rgba(255,255,255,.95), transparent 60%)',
      'radial-gradient(2px 2px at 820px 40px, rgba(255,255,255,.85), transparent 60%)',
      'radial-gradient(2px 2px at 960px 120px, rgba(255,255,255,.8), transparent 60%)',
    ].join(','),
    backgroundSize:'1000px 220px', animation:'starMove 28s linear infinite', opacity:.6,
  };
  return <div style={style}/>;
}

// ---------- Kitsch ----------
function ComicStamp({ children, rotate=-6 }) {
  return <div style={{
    display:'inline-block', padding:'6px 14px',
    border:'2px solid #ff4466', color:'#ff4466',
    fontWeight:800, fontSize:'.85rem', letterSpacing:'.15em',
    textTransform:'uppercase', transform:`rotate(${rotate}deg)`,
    borderRadius:4, fontFamily:"'Space Grotesk',system-ui,sans-serif",
  }}>{children}</div>;
}

function Sticker({ children, bg='#ff5db3', color='#220010' }) {
  return <span style={{
    display:'inline-flex', alignItems:'center', gap:4,
    background:bg, color, border:'2px solid #220010',
    padding:'4px 10px', borderRadius:999,
    fontSize:'.72rem', fontWeight:700, textTransform:'uppercase',
    boxShadow:'2px 2px 0 #220010', fontFamily:"'Space Grotesk',system-ui,sans-serif",
  }}>{children}</span>;
}

function HazardTape({ children }) {
  return <div style={{
    padding:'6px 10px',
    background:'repeating-linear-gradient(45deg, #ffd84d 0 14px, #220010 14px 28px)',
    color:'#fff', fontFamily:"'JetBrains Mono',monospace", fontSize:'.7rem',
    fontWeight:700, textTransform:'uppercase', letterSpacing:'.15em',
    textShadow:'1px 1px 2px #000', borderRadius:4, textAlign:'center',
  }}>{children}</div>;
}

function OwlBubble({ children }) {
  return (
    <div style={{ display:'flex', alignItems:'flex-end', gap:10, marginTop:'.8rem' }}>
      <div style={{ width:44, height:44, borderRadius:'50%', overflow:'hidden', border:'2px solid #220010', flexShrink:0 }}>
        <img src="/static/analtena-logo-main.png" style={{ width:'100%', height:'100%', objectFit:'cover' }}/>
      </div>
      <div style={{
        background:'#fff', color:'#220010', border:'2px solid #220010',
        borderRadius:12, padding:'6px 10px', fontWeight:700, fontSize:'.8rem',
        fontFamily:"'Space Grotesk',system-ui,sans-serif",
        boxShadow:'3px 3px 0 #220010',
      }}>{children}</div>
    </div>
  );
}

// ---------- App ----------
function Steps({ step }) {
  const s = (n, label) => {
    const cls = step > n ? 'done' : step === n ? 'active' : '';
    return <div className={'step-dot ' + cls} title={label}>{step > n ? '✓' : n}</div>;
  };
  return (
    <div className="steps">
      {s(1,'Connect')}<div className={'step-line ' + (step>1?'done':'')}/>
      {s(2,'Burn')}<div className={'step-line ' + (step>2?'done':'')}/>
      {s(3,'Link')}<div className={'step-line ' + (step>3?'done':'')}/>
      {s(4,'Allocated')}
    </div>
  );
}

function App() {
  const [evm, setEvm] = useState(null);
  const [svm, setSvm] = useState(null);
  const [amount, setAmount] = useState('');
  const [burns, setBurns] = useState([]);
  const [approved, setApproved] = useState(false);
  const [status, setStatus] = useState({ text:'', kind:null });
  const [xntPaid, setXntPaid] = useState(false);
  const [alloc, setAlloc] = useState(null);
  const [tab, setTab] = useState('burn');

  const step = !evm ? 1 : burns.length === 0 ? 2 : !svm || !xntPaid ? 3 : 4;

  const connectEvm = () => {
    setStatus({ text:'Connecting to MetaMask...', kind:null });
    setTimeout(() => {
      setEvm('0xA1b2C3d4E5f6' + Math.floor(Math.random()*9999).toString(16).padStart(4,'0') + '...c8F4');
      setStatus({ text:'Connected', kind:'ok' });
    }, 500);
  };

  const approve = () => {
    if (!amount || Number(amount) <= 0) { alert('Enter opXEN amount.'); return; }
    setStatus({ text:'Waiting for Approve...', kind:null });
    setTimeout(() => {
      setApproved(true);
      setStatus({ text:'Approve OK — you can now burn.', kind:'ok' });
    }, 600);
  };

  const burn = () => {
    if (!approved) { alert('Click Approve first.'); return; }
    if (!amount || Number(amount) <= 0) return;
    setStatus({ text:'Burning in progress...', kind:null });
    setTimeout(() => {
      const tx = '0x' + Math.floor(Math.random()*1e16).toString(16).padStart(10,'0');
      const n = Number(amount);
      setBurns(b => [{ amount:n, tx }, ...b].slice(0, 20));
      setStatus({ text:`✓ Burned ${n.toLocaleString('en')} opXEN — tx ${tx.slice(0,10)}...`, kind:'ok' });
      setAmount(''); setApproved(false);
      setTimeout(() => setTab('link'), 400);
    }, 800);
  };

  const connectSvm = () => {
    setTimeout(() => setSvm('F3eBDrrSmEnjNAHex7i1CXB9Mr2d1n192iNH2sPM8X98'), 400);
  };

  const payXnt = () => {
    if (!svm) return;
    setStatus({ text:'Paying 0.1 XNT on X1...', kind:null });
    setTimeout(() => {
      setXntPaid(true);
      const totalBurned = burns.reduce((s,b) => s + b.amount, 0);
      const anal = (totalBurned / 1_000_000) * 2;
      setAlloc({ anal: anal.toFixed(2), epoch: new Date().toISOString().slice(0,10) });
      setStatus({ text:'✓ Wallet linked. Airdrop allocation live.', kind:'ok' });
      setTab('alloc');
    }, 700);
  };

  const totalBurned = burns.reduce((s,b) => s + b.amount, 0);
  const globalBurned = 89_247_351 + totalBurned;

  return (
    <>
      <StarField/>
      <div className="container">
        <Card>
          <div style={{display:'flex', justifyContent:'center', marginBottom:'.8rem'}}>
            <img src="/static/analtena-logo-main.png" alt="ANALTENA"
                 style={{width:96, height:96, objectFit:'contain',
                         filter:'drop-shadow(0 0 16px rgba(255,20,147,.35))'}}/>
          </div>
          <h1 className="hero">🔥 Burn XEN for ANALTEN</h1>
          <p className="subtitle">
            Burn opXEN on Optimism · earn ANALTEN on X1 ·{' '}
            <a href="https://analtena.com/" target="_blank" rel="noopener" style={{color:'#ff5db3',textDecoration:'none',fontWeight:600}}>analtena.com</a>
          </p>

          <Steps step={step}/>

          <SectionLabel>Your wallets</SectionLabel>
          <AddressRow tag="EVM" address={evm}/>
          <AddressRow tag="SVM" address={svm}/>

          {!evm && <Button variant="pink" onClick={connectEvm}>Connect EVM Wallet</Button>}
          {evm && !svm && burns.length > 0 && (
            <Button variant="gold" onClick={connectSvm}>Connect Backpack / X1</Button>
          )}
          {evm && (
            <div className="tabs">
              <div className={'tab ' + (tab==='burn'?'on':'')} onClick={()=>setTab('burn')}>Burn</div>
              <div className={'tab ' + (tab==='link'?'on':'')} onClick={()=>setTab('link')}>Link SVM</div>
              <div className={'tab ' + (tab==='alloc'?'on':'')} onClick={()=>setTab('alloc')}>Allocation</div>
            </div>
          )}

          {evm && tab === 'burn' && (
            <>
              <SectionLabel>Burn opXEN</SectionLabel>
              <Input type="number" value={amount} onChange={setAmount} placeholder="Amount of opXEN"/>
              <Button variant="gold" onClick={approve} disabled={!amount} done={approved}>
                {approved ? '✓ Approved' : '1. Approve'}
              </Button>
              <Button variant="pink" onClick={burn} disabled={!approved}>2. Burn 🔥</Button>
              <StatusText kind={status.kind}>{status.text}</StatusText>

              {burns.length > 0 && (
                <>
                  <div className="stats-grid">
                    <StatTile label="My total burned" value={totalBurned.toLocaleString('en')}/>
                    <StatTile label="Global burned" value={globalBurned.toLocaleString('en')}/>
                  </div>
                  <Divider/>
                  <SectionLabel>Your burns</SectionLabel>
                  {burns.map((b,i) => <BurnEntry key={i} amount={b.amount} txHash={b.tx}/>)}
                </>
              )}
            </>
          )}

          {evm && tab === 'link' && (
            <>
              <SectionLabel>Link SVM wallet</SectionLabel>
              {!svm && (
                <>
                  <p style={{fontSize:'.82rem',color:'#c57aa8',margin:'0 0 .6rem'}}>
                    Connect Backpack or X1 Wallet to receive ANALTEN airdrop on X1/Solana.
                  </p>
                  <Button variant="gold" onClick={connectSvm} disabled={burns.length===0}>Connect Backpack / X1</Button>
                </>
              )}
              {svm && !xntPaid && (
                <>
                  <p style={{fontSize:'.82rem',color:'#c57aa8',margin:'.2rem 0 .8rem'}}>
                    One-time 0.1 XNT fee to lock your wallet pair.
                  </p>
                  <Button variant="pink" onClick={payXnt}>Pay 0.1 XNT</Button>
                </>
              )}
              {svm && xntPaid && <OwlBubble>done. weak burn tho, burn more 🍆</OwlBubble>}
              <StatusText kind={status.kind}>{status.text}</StatusText>
            </>
          )}

          {evm && tab === 'alloc' && (
            <>
              <SectionLabel>Your ANALTEN allocation</SectionLabel>
              {!alloc ? (
                <p style={{fontSize:'.82rem',color:'#c57aa8'}}>Finish Link step to see allocation.</p>
              ) : (
                <>
                  <HazardTape>⚠ EARLY BIRD × 2 BONUS · TOP 100 WALLETS</HazardTape>
                  <div className="alloc-stage">
                    <span className="egg-1">🍆</span>
                    <span className="egg-2">🍆</span>
                    <div className="stamp-pos"><ComicStamp rotate={10}>Burned 🔥</ComicStamp></div>
                    <div style={{fontSize:'.7rem',textTransform:'uppercase',letterSpacing:'.15em',color:'#c57aa8',fontFamily:"'JetBrains Mono',monospace"}}>ALLOCATED</div>
                    <div className="big">{alloc.anal}<span className="unit">ANAL</span></div>
                    <div style={{fontSize:'.75rem',color:'#c57aa8',fontFamily:"'JetBrains Mono',monospace"}}>Epoch {alloc.epoch}</div>
                  </div>
                  <div style={{display:'flex',gap:6,justifyContent:'center',marginTop:'.8rem',flexWrap:'wrap'}}>
                    <Sticker>🦉 ANALTENA APPROVED</Sticker>
                    <Sticker bg="#c4ff00">EARLY × 2</Sticker>
                  </div>
                  <OwlBubble>Widzimy się na airdropie. teraz spal więcej 🍆🍆🍆</OwlBubble>
                </>
              )}
            </>
          )}

          <Footer/>
        </Card>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
{% endraw %}
</script>

</body>
</html>
